global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s
scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: network-probe
    static_configs:
      - targets: ['probe:8000']
  - job_name: blackbox-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ['blackbox:9115']
  - job_name: blackbox-icmp
    scrape_interval: 60s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ['/discovery/icmp.json']
        refresh_interval: 10s
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-tcp
    scrape_interval: 60s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ['/discovery/tcp.json']
        refresh_interval: 10s
    relabel_configs: *blackbox_relabel
  - job_name: blackbox-http
    scrape_interval: 60s
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module: [http_head]
    file_sd_configs:
      - files: ['/discovery/http.json']
        refresh_interval: 10s
    relabel_configs: *blackbox_relabel
