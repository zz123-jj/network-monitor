name: ${COMPOSE_PROJECT_NAME:-network-monitor}
x-service: &service
  restart: unless-stopped
  networks: [monitoring_internal]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  security_opt: ['no-new-privileges:true']
services:
  probe:
    <<: *service
    build:
      context: .
      dockerfile: probe/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.15-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    volumes:
      - ./config:/config:ro
      - probe_data:/data
      - discovery:/discovery
    expose: ['8000']
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
  prometheus:
    <<: *service
    image: ${PROMETHEUS_IMAGE:-quay.io/prometheus/prometheus:v3.13.4}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}
      - --web.listen-address=0.0.0.0:9090
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - discovery:/discovery:ro
    expose: ['9090']
    depends_on:
      probe: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/-/ready']
      interval: 20s
      timeout: 5s
      retries: 3
  blackbox:
    <<: *service
    image: ${BLACKBOX_IMAGE:-quay.io/prometheus/blackbox-exporter:v0.29.0}
    command: ['--config.file=/config/blackbox.yml']
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    volumes: ['./config/blackbox.yml:/config/blackbox.yml:ro']
    expose: ['9115']
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9115/metrics']
      interval: 30s
      timeout: 5s
      retries: 3
  grafana:
    <<: *service
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
    cap_drop: [ALL]
    ports: ['${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose: ['3000']
    depends_on:
      prometheus: {condition: service_healthy}
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  backend:
    <<: *service
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.15-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROBE_URL: http://probe:8000
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    expose: ['8080']
    depends_on:
      probe: {condition: service_healthy}
      prometheus: {condition: service_healthy}
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 3
  frontend:
    <<: *service
    build:
      context: frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.3-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28.3-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=32m']
    ports: ['${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:8080']
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  monitoring_internal:
    driver: bridge
volumes:
  prometheus_data:
  grafana_data:
  probe_data:
  discovery:
